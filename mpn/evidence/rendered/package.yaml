---
# Source: horizon-uds-package/templates/package.yaml
# UDS Package CR: replaces deploy/charts/horizon-gateway (Envoy Gateway) with the
# UDS Istio tenant gateway, and declares the egress Horizon needs under UDS
# default-deny. Hostname becomes https://<PUBLIC_HOST>.
# The signed mode preserves the bundled default.
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: horizon
  namespace: horizon-uds
spec:
  network:
    serviceMesh:
      mode: ambient
    expose:
      - service: horizon-api
        selector:
          app.kubernetes.io/name: horizon-api
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 3001
        advancedHTTP:
          match:
            - name: api
              uri:
                prefix: /api
      - service: horizon-keycloak-http
        selector:
          app.kubernetes.io/name: keycloak
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 80
        targetPort: 8080
        advancedHTTP:
          match:
            - name: keycloak
              uri:
                prefix: /auth
      - service: nats
        selector:
          app.kubernetes.io/name: nats
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 8443
        advancedHTTP:
          match:
            - name: nats-ws
              uri:
                prefix: /ws
      - service: horizon-web
        selector:
          app.kubernetes.io/name: horizon-web
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 3000
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      # Keycloak discovery must hit the public issuer URL so `iss` matches.
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteHost: "###ZARF_VAR_PUBLIC_HOST###"
        remoteProtocol: TLS
        port: 443
        description: horizon-api -> own Keycloak via tenant gateway (OIDC discovery)
      # Keycloak brokers the explicitly configured external identity provider over TLS.
      - direction: Egress
        selector:
          app.kubernetes.io/name: keycloak
        remoteHost: "###ZARF_VAR_EXTERNAL_IDP_HOST###"
        remoteProtocol: TLS
        port: 443
        description: Keycloak -> external identity provider broker
      # The booth has public internet (Sep 17 tech sync): hosted LLM + map tiles.
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-chat-agent
        remoteGenerated: Anywhere
        port: 443
        description: chat-agent -> OpenAI/Anthropic
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteGenerated: Anywhere
        port: 443
        description: horizon-api -> Mapbox tiles / Scale (tighten to remoteHost once hosts are confirmed)
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-artifact-ingestion
        remoteGenerated: Anywhere
        port: 443
        description: artifact-ingestion -> OpenAI/Anthropic classifier and optional embedding provider
