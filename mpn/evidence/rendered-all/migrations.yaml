# Source: horizon-migrations/templates/tenant-bootstrap-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: horizon-migrations-tenant-bootstrap
  namespace: horizon-uds
  labels:
    helm.sh/chart: horizon-migrations-0.10.1
    app.kubernetes.io/name: horizon-migrations
    app.kubernetes.io/instance: migrations
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # This runs after the migration hook (weight -5), before application charts.
    # Keep the completed Job until a subsequent Helm hook run for deployment evidence.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-migrations
        app.kubernetes.io/instance: migrations
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tenant-bootstrap
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-api:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: [node]
          args:
            - --input-type=module
            - -e
            - |
              import postgres from 'postgres';
              import { createAccount } from '@nats-io/nkeys';

              const sql = postgres({
                host: process.env.POSTGRES_HOST,
                port: Number(process.env.POSTGRES_PORT),
                database: process.env.POSTGRES_DB,
                username: process.env.POSTGRES_ADMIN_USERNAME,
                password: process.env.POSTGRES_ADMIN_PASSWORD,
                ssl: false,
                max: 1,
                connection: {
                  search_path: 'app,public',
                  statement_timeout: 0,
                },
                onnotice: () => {},
              });
              try {
                const natsAccountPublicKey = createAccount().getPublicKey();
                await sql`SELECT tenant_id FROM app.find_or_create_tenant_by_slug(${process.env.TENANT_SLUG}, ${process.env.TENANT_SLUG}, ${natsAccountPublicKey})`;
                await sql.unsafe('ANALYZE;');
                console.log('Tenant bootstrap and PostgreSQL statistics refresh completed');
              } finally {
                await sql.end({ timeout: 5 });
              }
          env:
            - name: POSTGRES_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-username
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-password
            - name: POSTGRES_HOST
              value: "horizon-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "horizon"
            - name: POSTGRES_SSLMODE
              value: "disable"
            - name: TENANT_SLUG
              value: "gallatin"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 512Mi
