# Source: horizon-migrations/templates/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: horizon-migrations-migrate
  namespace: horizon-uds
  labels:
    helm.sh/chart: horizon-migrations-0.10.1
    app.kubernetes.io/name: horizon-migrations
    app.kubernetes.io/instance: migrations
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Argo CD ignores Helm hooks when native hooks are present; Flux uses the
    # Helm annotations to replace the stable named Job before rerunning it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-5"
    argocd.argoproj.io/hook: PreSync
    # Clean up only after Argo observes a terminal result. BeforeHookCreation
    # can leave retries stuck Pending deletion after Kubernetes removes a hook.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-migrations
        app.kubernetes.io/instance: migrations
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      
      initContainers:
        # Native sidecar (restartPolicy: Always) must come before
        # create-databases so stunnel is running when create-databases
        # tries to reach 127.0.0.1:5432.
        - name: create-databases
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-postgres:main-979715f603cb3e07a921a8caffd32b4c456bb789-15160"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
              value: "horizon-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-password
          command:
            - sh
            - -ce
            - |
              if psql -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | read _; then
                echo 'Database "keycloak" already exists — skipping'
              else
                createdb -T template0 'keycloak'
                echo 'Created database "keycloak"'
              fi
        - name: atlas-migrate
          image: 334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-migrations:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /atlas
          args:
            - migrate
            - apply
            - --env
            - docker
          env:
            - name: POSTGRES_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-username
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-password
            - name: POSTGRES_HOST
              value: "horizon-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "horizon"
            - name: POSTGRES_SSLMODE
              value: "disable"
            - name: POSTGRES_HORIZON_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: horizon-app-username
            - name: POSTGRES_HORIZON_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: horizon-app-password
            - name: POSTGRES_OPENFGA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: openfga-username
            - name: POSTGRES_OPENFGA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: openfga-password
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 512Mi
          volumeMounts:
            - name: cache
              mountPath: /.cache
            - name: tmp
              mountPath: /tmp
        # Reloads the template tenant from the seed JSON baked into the image.
        # Runs after every full apply so schema and template data land in the
        # same Job; a failed load rolls back only the reload.
        - name: foundational-loader
          image: 334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-migrations:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /foundational-loader
          env:
            - name: POSTGRES_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-username
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-password
            - name: POSTGRES_HOST
              value: "horizon-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "horizon"
            - name: POSTGRES_SSLMODE
              value: "disable"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 512Mi
        - name: road-graph-loader
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-road-graph:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /road-graph-loader
          env:
            - name: POSTGRES_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-username
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-postgres-secret
                  key: admin-password
            - name: POSTGRES_HOST
              value: "horizon-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "horizon"
            - name: POSTGRES_SSLMODE
              value: "disable"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 512Mi
      containers:
        - name: node-projection-rollout
          image: 334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-migrations:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637
          imagePullPolicy: IfNotPresent
