# Source: horizon-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-web
  labels:
    helm.sh/chart: horizon-service-0.18.0
    app.kubernetes.io/name: horizon-web
    app.kubernetes.io/instance: horizon-web
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-web
      app.kubernetes.io/instance: horizon-web
  template:
    metadata:
      annotations:
        checksum/config: ec32c008e55fc548ecf5927b01e0cf5bd1bf703edf40a3c445850b4481e1c440
      labels:
        helm.sh/chart: horizon-service-0.18.0
        app.kubernetes.io/name: horizon-web
        app.kubernetes.io/instance: horizon-web
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: horizon-web
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: horizon-web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: 334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-web:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TILES_SATELLITE_TILE_SIZE
              value: "256"
            - name: TILES_SATELLITE_ATTRIBUTION
              value: ""
            - name: TILES_SATELLITE_REVISION
              value: "v0"
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: nginx-config
              readOnly: true
            - mountPath: /usr/share/nginx/html/config.json
              name: runtime-config
              readOnly: true
              subPath: config.json
            - mountPath: /var/cache/nginx
              name: nginx-cache
            - mountPath: /var/run
              name: nginx-run
            - mountPath: /var/lib/nginx/tmp
              name: nginx-tmp
      volumes:
        - configMap:
            items:
            - key: default.conf
              path: default.conf
            name: horizon-web
          name: nginx-config
        - configMap:
            items:
            - key: config.json
              path: config.json
            name: horizon-web
          name: runtime-config
        - emptyDir: {}
          name: nginx-cache
        - emptyDir: {}
          name: nginx-run
        - emptyDir: {}
          name: nginx-tmp
