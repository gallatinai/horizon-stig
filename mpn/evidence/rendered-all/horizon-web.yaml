# Source: horizon-service/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: horizon-web
  labels:
    helm.sh/chart: horizon-service-0.18.0
    app.kubernetes.io/name: horizon-web
    app.kubernetes.io/instance: horizon-web
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.json: |
    {
      "nats": {
        "sentinelJwt": "###ZARF_VAR_NATS_SENTINEL_JWT###"
      },
      "map": {
        "provider": "mapbox"
      },
      "mapbox": {
        "accessToken": "###ZARF_VAR_MAPBOX_ACCESS_TOKEN###"
      },
      "maplibre": {
        "styleCatalogUrl": "/api/v1/tiles/styles.json"
      },
      "sentry": {
        "enabled": false,
        "dsn": "",
        "environment": "###ZARF_VAR_SENTRY_ENVIRONMENT###"
      },
      "oidc": {
        "authority": "https://###ZARF_VAR_PUBLIC_HOST###/auth/realms/horizon",
        "clientId": "horizon",
        "scope": "openid email profile offline_access"
      }
    }
  default.conf: |
    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;
  
        location / {
            try_files $uri $uri/ /index.html;
        }
  
        location /assets {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
  
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
