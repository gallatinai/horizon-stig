apiVersion: batch/v1
kind: Job
metadata:
  name: horizon-keycloak-provision-20261109-232944
  namespace: horizon-uds
  labels:
    helm.sh/chart: keycloak-7.2.3
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.7.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: provision
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-provision
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/component: provision
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for Keycloak readiness so the provision script can use its API.
        - name: wait-for-keycloak
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-keycloak-provision:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637"
          imagePullPolicy: IfNotPresent
          command: ['node', '-e']
          args:
            - |
              const url = process.env.KEYCLOAK_READY_URL;
              const deadline = Date.now() + 1000 * 60 * 10;
              async function wait() {
                while (Date.now() < deadline) {
                  try {
                    const res = await fetch(url);
                    if (res.ok) { console.log('keycloak ready'); return; }
                  } catch (_) {}
                  await new Promise(r => setTimeout(r, 2000));
                }
                console.error('timed out waiting for keycloak');
                process.exit(1);
              }
              wait();
          env:
            - name: KEYCLOAK_READY_URL
              value: "http://horizon-keycloak-headless:9000/auth/health/ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: provision
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/horizon-keycloak-provision:main-dc55bd44c7cb58b18b6bb7c7cdbdf4dcdd5fa2c6-15637"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: KEYCLOAK_BASE_URL
              value: "http://horizon-keycloak-headless:8080/auth"
            - name: KEYCLOAK_PROVISION_CONFIG
              value: /config/provision-config.json
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
                  name: horizon-keycloak-admin-secret
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
                  name: horizon-keycloak-admin-secret
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: horizon-keycloak-provision
        - name: tmp
          emptyDir: {}
