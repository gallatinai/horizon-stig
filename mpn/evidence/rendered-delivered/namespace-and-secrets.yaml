# Source: horizon-uds-package/templates/package.yaml
# UDS Package CR: replaces deploy/charts/horizon-gateway (Envoy Gateway) with the
# UDS Istio tenant gateway, and declares the egress Horizon needs under UDS
# default-deny. Hostname becomes https://<PUBLIC_HOST>.
# The signed mode preserves the bundled default.
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: horizon
  namespace: horizon-uds
spec:
  sso:
    - attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://horizon.uds.dev/logged-out
      clientId: gallatin-horizon-web
      defaultClientScopes:
      - profile
      - email
      enabled: true
      fullScopeAllowed: false
      name: Gallatin Horizon web
      protocol: openid-connect
      protocolMappers:
      - config:
          access.token.claim: "true"
          claim.name: sub
          id.token.claim: "true"
          jsonType.label: String
          user.attribute: id
          userinfo.token.claim: "true"
        name: horizon-subject
        protocol: openid-connect
        protocolMapper: oidc-usermodel-property-mapper
      - config:
          access.token.claim: "true"
          claim.name: groups
          full.path: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
        name: horizon-groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
      - config:
          access.token.claim: "true"
          id.token.claim: "false"
          included.custom.audience: urn:gallatin:horizon
        name: horizon-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
      publicClient: true
      redirectUris:
      - https://horizon.uds.dev/oauth2/callback
      serviceAccountsEnabled: false
      standardFlowEnabled: true
      webOrigins:
      - https://horizon.uds.dev
    - attributes:
        pkce.code.challenge.method: S256
      clientId: gallatin-horizon-cli
      defaultClientScopes:
      - profile
      - email
      enabled: true
      fullScopeAllowed: false
      name: Gallatin Horizon CLI
      protocol: openid-connect
      protocolMappers:
      - config:
          access.token.claim: "true"
          claim.name: sub
          id.token.claim: "true"
          jsonType.label: String
          user.attribute: id
          userinfo.token.claim: "true"
        name: horizon-subject
        protocol: openid-connect
        protocolMapper: oidc-usermodel-property-mapper
      - config:
          access.token.claim: "true"
          claim.name: groups
          full.path: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
        name: horizon-groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
      - config:
          access.token.claim: "true"
          id.token.claim: "false"
          included.custom.audience: urn:gallatin:horizon
        name: horizon-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
      publicClient: true
      redirectUris:
      - http://localhost/callback
      serviceAccountsEnabled: false
      standardFlowEnabled: true
      webOrigins: []
  network:
    serviceMesh:
      mode: ambient
    expose:
      - service: horizon-api
        selector:
          app.kubernetes.io/name: horizon-api
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 3001
        advancedHTTP:
          match:
            - name: api
              uri:
                prefix: /api
      - service: nats
        selector:
          app.kubernetes.io/name: nats
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 8443
        advancedHTTP:
          match:
            - name: nats-ws
              uri:
                prefix: /ws
      - service: horizon-web
        selector:
          app.kubernetes.io/name: horizon-web
        gateway: tenant
        host: "###ZARF_VAR_HOST###"
        port: 3000
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      # Shared identity requires the public issuer and the tenant gateway.
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteHost: "sso.uds.dev"
        remoteProtocol: TLS
        port: 443
        description: horizon-api -> shared OIDC issuer and JWKS
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteNamespace: keycloak
        remoteSelector:
          app.kubernetes.io/name: keycloak
        port: 8080
        description: horizon-api -> UDS Keycloak
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteNamespace: istio-tenant-gateway
        remoteSelector:
          app: tenant-ingressgateway
        port: 443
        description: horizon-api -> UDS tenant gateway for public issuer
      # The booth has public internet (Sep 17 tech sync): hosted LLM + map tiles.
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-chat-agent
        remoteGenerated: Anywhere
        port: 443
        description: chat-agent -> OpenAI/Anthropic
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-api
        remoteGenerated: Anywhere
        port: 443
        description: horizon-api -> Mapbox tiles / Scale (tighten to remoteHost once hosts are confirmed)
      - direction: Egress
        selector:
          app.kubernetes.io/name: horizon-artifact-ingestion
        remoteGenerated: Anywhere
        port: 443
        description: artifact-ingestion -> OpenAI/Anthropic classifier and optional embedding provider
