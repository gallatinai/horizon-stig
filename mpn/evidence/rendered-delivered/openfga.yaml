# Source: openfga/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-openfga
  labels:
    helm.sh/chart: openfga-0.3.13
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: openfga
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.18.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openfga
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/instance: openfga
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
      labels:
        helm.sh/chart: openfga-0.3.13
        app.kubernetes.io/name: openfga
        app.kubernetes.io/instance: openfga
        app.kubernetes.io/component: authorization-controller
        app.kubernetes.io/version: "v1.18.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: openfga
    spec:
      serviceAccountName: horizon-openfga
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      initContainers:
        - name: migrate-database
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/cgr.dev/gallatin.ai/openfga-fips@sha256:d4ecc30f25ffc3e564bf94cc74819b373366662b6942acca648f7216444ae7c6"
          imagePullPolicy: IfNotPresent
          args: [ "migrate" ]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "horizon-openfga-datastore-secret"
                  key: "uri"
            - name: OPENFGA_DATASTORE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "horizon-postgres-secret"
                  key: "openfga-username"
            - name: OPENFGA_DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "horizon-postgres-secret"
                  key: "openfga-password"
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: openfga
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "334883685015.dkr.ecr.us-west-2.amazonaws.com/cgr.dev/gallatin.ai/openfga-fips@sha256:d4ecc30f25ffc3e564bf94cc74819b373366662b6942acca648f7216444ae7c6"
          imagePullPolicy: IfNotPresent
          args: ["run"]
          ports:
            - name: grpc
              containerPort: 8081

            - name: http
              containerPort: 8080
              protocol: TCP

            - name: profiler
              containerPort: 3001
              protocol: TCP

            - name: playground
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP

          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "horizon-openfga-datastore-secret"
                  key: "uri"
            - name: OPENFGA_DATASTORE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "horizon-postgres-secret"
                  key: "openfga-username"
            - name: OPENFGA_DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "horizon-postgres-secret"
                  key: "openfga-password"
            

            - name: OPENFGA_DATASTORE_METRICS_ENABLED
              value: "false"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:8081"

            - name: OPENFGA_HTTP_ENABLED
              value: "true"
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: OPENFGA_HTTP_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: OPENFGA_HTTP_CORS_ALLOWED_HEADERS
              value: "*"
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef:
                  name: "horizon-openfga-secret"
                  key: keys

            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_PLAYGROUND_PORT
              value: "3000"
            - name: OPENFGA_LOG_FORMAT
              value: json
            - name: OPENFGA_LOG_LEVEL
              value: info
            - name: OPENFGA_LOG_TIMESTAMP_FORMAT
              value: Unix
            - name: OPENFGA_REQUEST_DURATION_DATASTORE_QUERY_COUNT_BUCKETS
              value: "50,200"

            - name: OPENFGA_METRICS_ENABLED
              value: "true"
            - name: OPENFGA_METRICS_ADDR
              value: "0.0.0.0:2112"
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081
          livenessProbe:
            failureThreshold: 12
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081

          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
