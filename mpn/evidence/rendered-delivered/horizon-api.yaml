---
# Source: horizon-service/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: horizon-api
  labels:
    helm.sh/chart: horizon-service-0.18.0
    app.kubernetes.io/name: horizon-api
    app.kubernetes.io/instance: horizon-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
# Source: horizon-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: horizon-api
  labels:
    helm.sh/chart: horizon-service-0.18.0
    app.kubernetes.io/name: horizon-api
    app.kubernetes.io/instance: horizon-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    com.palantir.rubix.service/pod-cert: '{}'
spec:
  type: ClusterIP
