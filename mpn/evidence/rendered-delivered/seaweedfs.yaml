# Source: seaweedfs/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "horizon",
          "credentials": [
            {
              "accessKey": "###ZARF_VAR_S3_ACCESS_KEY_ID###",
              "secretKey": "###ZARF_VAR_S3_SECRET_ACCESS_KEY###"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
# Source: seaweedfs/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# Source: seaweedfs/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
    - name: filer
      port: 8888
      targetPort: filer
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
